name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate application
        run: npm run validate
      - name: Validate Trust Layer
        run: npm run validate:phase-60 && npm run validate:phase-61
      - name: Validate Local-first Excellence and Professional Polish
        run: npm run validate:phase-62 && npm run validate:phase-63 && npm run validate:phase-64 && npm run validate:phase-65 && npm run validate:phase-66 && npm run validate:phase-67 && npm run validate:phase-68 && npm run validate:phase-69 && npm run validate:phase-70 && npm run validate:phase-71
      - name: Build static artifact
        run: npm run build:pages
      - name: Validate static artifact
        run: npm run validate:pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
